name: Weekly refresh

# Task 10 (frontend cutover) rewrote this from the ground up. The old
# version scraped into data/meetings.json, rendered a static site, and
# deployed it to GitHub Pages -- all retired now that the live site is
# served directly by the Render-hosted FastAPI app (api/main.py) from its
# own database. A GitHub Actions runner has no way to reach that
# database file directly, so this workflow's only job now is to call the
# live service's own refresh endpoint (api/routes/admin.py), which runs
# the pipeline stages in-process against the disk it already has open.
#
# This only refreshes documents/tags/briefings for meetings ALREADY in
# the live database -- getting brand-new meetings into it is a real,
# separate gap (see pm/STATUS.md Known issues: the scrape stage was
# never rewritten to write to the database, and db/migrate.py's
# JSON-to-DB migration is destructive to re-run). Documented, not hidden.

on:
  schedule:
    # Mondays 15:00 UTC (~8am Pacific during PDT). GitHub Actions cron is UTC only.
    - cron: "0 15 * * 1"
  workflow_dispatch: {}   # lets you click "Run workflow" in the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call the live refresh endpoint
        run: |
          code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "X-Refresh-Token: ${{ secrets.REFRESH_TOKEN }}" \
            --max-time 1800 \
            "${{ vars.HEALTH_DOCKET_API_URL || 'https://health-docket-api.onrender.com' }}/api/admin/refresh")
          echo "HTTP $code"
          cat response.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Refresh endpoint returned $code"
            exit 1
          fi
          ok=$(python3 -c "import json; print(json.load(open('response.json'))['ok'])")
          if [ "$ok" != "True" ]; then
            echo "::warning::One or more pipeline stages reported ok:false -- see response.json above for which"
          fi
